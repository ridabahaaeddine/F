<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>من القلب ليكِ 💖</title>

<style>
body {
  margin: 0;
  min-height: 100vh;
  background: linear-gradient(135deg, #ffb6c1, #ffd1dc);
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: Arial, sans-serif;
}

.card {
  background: white;
  padding: 30px;
  border-radius: 30px;
  box-shadow: 0 20px 80px rgba(0,0,0,0.25);
  text-align: center;
  width: 420px;
}

h1 {
  color: #e91e63;
  font-size: 25px;
  line-height: 1.7;
}

.stickers {
  font-size: 60px;
  margin: 10px 0;
}

.gif {
  width: 100%;
  border-radius: 20px;
  margin: 20px 0;
}

button {
  padding: 20px 35px;
  font-size: 24px;
  border: none;
  border-radius: 18px;
  cursor: pointer;
  margin: 20px;
}

#yes {
  background: #4caf50;
  color: white;
}

#no {
  background: #f44336;
  color: white;
  position: absolute;
}
</style>
</head>

<body>

<audio id="music" loop>
  <source src="hyati.mp3" type="audio/mpeg">
</audio>

<div class="card">
  <div class="stickers">❤️🫀</div>

  <!-- GIF تاع الدبدوب الأول -->
  <img class="gif" src="https://media.tenor.com/ITtPYeOZKpYAAAAM/aw-its-so-cute.gif">

  <div class="stickers">❤️‍🩹💍👑</div>

  <h1>
    حبيت نسقسكيي سؤال 🥹❤️<br><br>
    تقبلي تكوني Valentine تاعي 👸🏻❤️؟
  </h1>

  <button id="yes" onclick="yesClick()">نعم 😍</button>
  <button id="no" onmouseover="moveNo()">لا 🙄</button>
</div>

<script>
const herName = "فاطمة";
const music = document.getElementById("music");

function yesClick() {
  music.play();

  document.body.innerHTML = `
  <audio autoplay loop>
    <source src="hyati.mp3" type="audio/mpeg">
  </audio>

  <div style="
    background: linear-gradient(135deg, #ffdde1, #ee9ca7);
    min-height:100vh;
    padding:30px;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    font-family:Arial;
    overflow:auto;">

    <div style="max-width:760px;">
      <!-- GIF تاع Stitch + Lilo بعد نعم -->
      <img src="https://media.tenor.com/RjanSXLnkCgAAAAM/lilo-and-stitch-couple.gif"
           style="width:100%; border-radius:35px; margin-bottom:35px;">

      <h1 style="color:#e91e63; font-size:25px; line-height:2.0;">
        ${herName}… 🌹<br><br>

        ما جيتش نلعب، وما جيتش نجرّب،  
        جيتك بقلب عارف وش حاب،  
        وبروح تحبك بصح،  
        حب راجل يشوفك وطن ماشي مرحلة 💫<br><br>

        علابالي كلش بالمكتوب،  
        بصح أنا نحب ونبغيك،  
        ونموت عليك،  
        وانتي لي نبقا نحبها طول حياتي 🥹❤️<br><br>

        معاك نحب نكون راجل يحمي،  
        يسمع، يفهم، ويصبر،  
        راجل إذا تعبتي تلقاي صدرو،  
        وإذا ضحكتي يضحك قلبو قبلك 💖<br><br>

        نحبك ونبغيك فاتي تاعي 👸🏻❤️  
        وما نحتاج حتى وعد…  
        غير كونك معايا،  
        هذا يكفيني دنيا كاملة ✨<br><br>

        Valentine سعيد علينا 🌹💌
      </h1>
    </div>
  </div>`;
}

function moveNo() {
  const btn = document.getElementById("no");
  const x = Math.random() * (window.innerWidth - 120);
  const y = Math.random() * (window.innerHeight - 60);
  btn.style.left = x + "px";
  btn.style.top = y + "px";
}
</script>

</body>
</html>
